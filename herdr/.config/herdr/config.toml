onboarding = false
# Keybindings mapped to match ~/.tmux.conf

[keys]
prefix = "ctrl+s"

# splits (tmux: prefix+/ side-by-side, prefix+- stacked)
split_vertical = "prefix+/"
split_horizontal = "prefix+minus"

# pane focus: prefix+hjkl only — bare ctrl+hjkl must pass through to neovim,
# which handles edge-of-vim navigation via `herdr pane focus` (see nvim init.lua)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# kill pane / tab (tmux: prefix+w kill-pane, prefix+q kill-window)
close_pane = "prefix+w"
close_tab = "prefix+q"

# detach like tmux default
detach = "prefix+d"

# session/workspace pickers (tmux: prefix+s choose-tree)
goto = "prefix+s"
workspace_picker = "prefix+shift+s"

# settings moved off prefix+s to make room for goto
settings = "prefix+comma"

# toggle spaces/agents sidebar
toggle_sidebar = "prefix+b"

# resize focused pane without entering resize mode (resize mode: prefix+r).
# herdr has no built-in per-direction resize keys, so shell out to the CLI.

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "herdr pane resize --current --direction left"
description = "resize pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr pane resize --current --direction down"
description = "resize pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr pane resize --current --direction up"
description = "resize pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr pane resize --current --direction right"
description = "resize pane right"

# softer ping (Morse @ 50%, built with: afconvert -> lame --scale 0.5)
[ui.sound]
path = "sounds/morse.mp3"
